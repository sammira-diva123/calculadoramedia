<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Boletim</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="cabecalho">
                <div class="icone">♡</div>

                <div>
                    <h1>Meu Boletim</h1>
                    <p>Calculadora de média escolar</p>
                </div>
            </div>

            <div class="linha"></div>

            <div class="notas">

                <div class="campo">
                    <label for="nota1">1ª Nota</label>
                    <input type="number" id="nota1" min="0" max="10" step="0.1">
                </div>

                <div class="campo">
                    <label for="nota2">2ª Nota</label>
                    <input type="number" id="nota2" min="0" max="10" step="0.1">
                </div>

                <div class="campo">
                    <label for="nota3">3ª Nota</label>
                    <input type="number" id="nota3" min="0" max="10" step="0.1">
                </div>

                <div class="campo">
                    <label for="nota4">4ª Nota</label>
                    <input type="number" id="nota4" min="0" max="10" step="0.1">
                </div>

            </div>

            <button id="btnCalcular">
                Calcular Média →
            </button>

            <div id="resultado" class="resultado">

                <div class="media">
                    <span>SUA MÉDIA</span>
                    <strong id="valorMedia">0,0</strong>
                </div>

                <div class="situacao">

                    <div id="iconeSituacao" class="icone-situacao">
                        ♡
                    </div>

                    <div>
                        <strong id="textoSituacao">
                            Aguardando notas
                        </strong>

                        <p id="textoDescricao">
                            Digite suas notas para ver o resultado.
                        </p>
                    </div>

                </div>

            </div>

            <button id="btnLimpar" class="limpar">
                Limpar notas
            </button>

            <footer>
                Feito para facilitar seus estudos ♡
            </footer>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
